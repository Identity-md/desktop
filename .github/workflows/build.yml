name: Build installers

permissions:
  contents: read

# Installers for macOS and Windows, as Skillet builds its desktop app. Tauri does not cross-compile, so
# each platform has its own runner. Run it from the Actions tab: macOS runners bill at ten times the
# minutes, so it does not run on every push while the repository is private.
#
# Unsigned: releases are signed and published from the maintainer's Mac by scripts/release.mjs, which builds the
# Windows installer there too. On Windows the installer is also installed and the app opened, and a picture of
# the screen kept, for a look at it on Windows itself.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos }
          - { os: windows-latest, name: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: "src-tauri -> target" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: imd-agents-${{ matrix.name }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
      # installed for this user alone, as a person's double-click would, then opened by hand: the panel opens over the
      # taskbar's corner, and the screen is photographed with it
      - name: Install and open it
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          Start-Process "$env:LOCALAPPDATA\IMD Agents\imd-agents.exe"
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          New-Item -ItemType Directory -Force shots | Out-Null
          $shot.Save("$PWD/shots/first-open.png")
          if (-not (Get-Process imd-agents -ErrorAction SilentlyContinue)) { throw "IMD Agents isn't running" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.name == 'windows'
        with:
          name: imd-agents-windows-first-open
          path: shots/
          if-no-files-found: error
          retention-days: 14
